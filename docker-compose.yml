services:
  postgres:
    image: postgres:15
    container_name: pg_testcase
    restart: always
    environment:
      POSTGRES_DB: test_case
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis_testcase
    ports:
      - "6379:6379"
    restart: always

volumes:
  pg_data:

